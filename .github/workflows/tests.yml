name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Solo lectura: este workflow no puede modificar el repositorio.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Pruebas unitarias y de integración
        run: python -m unittest discover -s tests -t . -v

      - name: Trazas de los ciclos verificados
        run: python -m herramientas.trazas

      # ejecutar.sh crea .venv, instala requirements.txt y abre el juego. Con el driver "dummy"
      # el juego corre sin ventana; si sigue vivo a los 25 s (código 124 de timeout) arrancó bien.
      - name: ejecutar.sh arranca el juego
        run: |
          chmod +x ejecutar.sh
          set +e
          timeout 25 ./ejecutar.sh
          codigo=$?
          echo "código de salida: $codigo"
          test "$codigo" -eq 124
